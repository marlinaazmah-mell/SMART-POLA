<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMART-POLA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>SMART-POLA</h1>
    <p>AI Pattern Measurement Assistant</p>

    <hr>

    <h2>1. INPUT UKURAN BADAN</h2>

    <label>Pinggang (cm)</label>
    <input type="number" id="pinggang" placeholder="Contoh: 76">

    <label>Punggung (cm)</label>
    <input type="number" id="punggung" placeholder="Contoh: 100">

    <label>Panjang Pola (cm)</label>
    <input type="number" id="panjang" placeholder="Contoh: 40">

    <br>

    <button onclick="semakUkuran()">SEMAK POLA</button>

    <hr>

    <h2>2. FORMULA POLA</h2>

    <div id="formula">
        Formula akan dipaparkan selepas ukuran dimasukkan.
    </div>

    <h2>3. KEPUTUSAN</h2>

    <div id="result">
        Sila masukkan ukuran badan.
    </div>

    <script src="script.js"></script>

</body>
</html>
