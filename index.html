<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART-POLA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>SMART-POLA</h1>
    <p>AI Pattern Measurement Assistant</p>

    <hr>

    <h2>1. INPUT UKURAN BADAN</h2>

    <label>Pinggang (cm)</label>
    <input type="number" id="pinggang" placeholder="Contoh: 76">

    <label>Punggung (cm)</label>
    <input type="number" id="punggung" placeholder="Contoh: 100">

    <label>Panjang Pola (cm)</label>
    <input type="number" id="panjang" placeholder="Contoh: 40">

    <button onclick="semakUkuran()">SEMAK POLA</button>

    <hr>

    <h2>2. FORMULA POLA</h2>

    <div id="formula">
        Formula akan dipaparkan selepas ukuran dimasukkan.
    </div>

    <hr>

    <h2>3. KEPUTUSAN</h2>

    <div id="result">
        Sila masukkan ukuran.
    </div>

    <hr>

<h2>4. SEMAK UKURAN POLA</h2>

<label>Ukuran Pola Pinggang (cm)</label>
<input type="number" id="polaPinggang" placeholder="Contoh: 19">

<label>Ukuran Pola Punggung (cm)</label>
<input type="number" id="polaPunggung" placeholder="Contoh: 25">

<button onclick="semakPola()">SEMAK UKURAN POLA</button>

<div id="semakan">
    Masukkan ukuran pola untuk semakan.
</div>

<script src="semakan.js"></script>
    <hr>

<h2>5. IMBAS POLA</h2>

<input
    type="file"
    id="gambarPola"
    accept="image/*"
    capture="environment"
    onchange="paparGambar(event)"
    style="display:none;"
>

<button onclick="bukaKamera()">📷 BUKA KAMERA / PILIH GAMBAR</button>
    
    <button onclick="kesanGarisan()">🔎 KESAN GARISAN POLA</button>

<p id="statusKamera">Belum ada gambar.</p>

<img
    id="previewPola"
    style="display:none; width:100%; margin-top:15px; border-radius:10px;"
    alt="Pratonton pola"
>
<script src="semakan.js"></script>
<script src="script.js"></script>
<script src="kamera.js"></script>
<script src="pengesan.js"></script>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

</body>
</html>
